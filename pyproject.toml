[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "medflow-africa"
version = "0.1.0"
description = "Human-reviewed essential-medicines decision support, using synthetic data"
requires-python = ">=3.9,<3.13"
dependencies = [
  "fastapi==0.111.1", "uvicorn==0.23.2", "pydantic==2.8.0",
  "python-multipart==0.0.20", "httpx==0.28.1", "python-dotenv==1.0.0"
]

[project.optional-dependencies]
analysis = ["numpy==2.0.2", "pandas==2.3.3", "scikit-learn==1.6.1", "streamlit==1.50.0"]
dev = ["pytest==8.4.2", "hypothesis==6.141.1", "pytest-cov==6.3.0", "ruff==0.14.3", "mypy==1.18.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = true
